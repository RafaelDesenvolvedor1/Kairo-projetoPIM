services:
  mysql:
    image: mariadb:10.6
    container_name: homolog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - homolog_mysql_data:/var/lib/mysql
    networks:
      - homolog-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: homolog-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - homolog-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homolog-backend
    restart: unless-stopped
    env_file:
      - .env.homolog
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      PORT: ${BACKEND_PORT:-3000}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - homolog-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_PORT=${VITE_API_PORT}
        - VITE_API_URL=${VITE_API_URL}
    container_name: homolog-frontend
    restart: unless-stopped
    ports:
      - "80:80"  # Frontend servido diretamente na porta HTTP padrão
    depends_on:
      - backend
    networks:
      - homolog-network

volumes:
  homolog_mysql_data:

networks:
  homolog-network:
    driver: bridge